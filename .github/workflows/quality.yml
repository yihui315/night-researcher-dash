name: Quality Gates
on:
  pull_request:
  push:
    branches: ["main", "feat/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python syntax
        run: python -m compileall -q backtest_engine.py strategies.py run_research.py brc20_runes_monitor.py connectors_extra.py
      - name: Backtest execution tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Paper trading and AI proxy tests
        run: npm test
      - name: Browser end-to-end tests
        run: npm run test:e2e