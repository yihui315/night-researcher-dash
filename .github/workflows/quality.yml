name: Quality Gates
on:
  pull_request:
  push:
    branches: ["main", "feat/**"]
permissions:
  contents: read
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python syntax
        run: python -m compileall -q backtest_engine.py strategies.py run_research.py brc20_runes_monitor.py connectors_extra.py
      - name: Backtest execution tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Paper trading and AI proxy tests
        run: npm test
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Publish browser test diagnostics to PR
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          path = "test-results/report.json"
          failures = []
          if os.path.exists(path):
              report = json.load(open(path, encoding="utf-8"))
              def walk(suites):
                  for suite in suites or []:
                      for spec in suite.get("specs", []):
                          for case in spec.get("tests", []):
                              for result in case.get("results", []):
                                  if result.get("status") != "passed":
                                      error = result.get("error") or {}
                                      failures.append((spec.get("title", "untitled"), result.get("status"), error.get("message") or error.get("stack") or "No error detail"))
                      walk(suite.get("suites", []))
              walk(report.get("suites", []))
          else:
              failures.append(("report", "missing", "Playwright JSON report was not generated"))
          lines = [
              "### Night Researcher Playwright E2E diagnostics",
              "Run: " + os.environ.get("GITHUB_SERVER_URL", "https://github.com") + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "Failed/unfinished tests: " + str(len(failures))
          ]
          for index, (title, status, error) in enumerate(failures, 1):
              lines.extend(["", f"{index}. **{title}** ({status})", "", "~~~text", str(error)[:2500], "~~~"])
          body = "\\n".join(lines)
          subprocess.run([
              "gh", "api", "--method", "POST",
              f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments",
              "-f", "body=" + body
          ], check=True)
          PY
