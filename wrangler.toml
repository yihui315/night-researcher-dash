# Wrangler 配置 — Night Researcher Paper Trading（Pages Functions + D1）
# 注意：本配置面向【独立测试数据库】，禁止指向生产库。
name = "night-researcher-dash"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# 独立测试 D1 实例。生产部署时请改用生产 database_name / database_id，
# 并通过环境变量或独立 wrangler 环境（[env.production]）隔离，绝不混用。
[[d1_databases]]
binding = "DB"
database_name = "paper_test"
database_id = "REPLACE_WITH_TEST_DATABASE_ID"
